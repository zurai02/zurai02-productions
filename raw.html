<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Zurai02 Raw</title>
<base target="_blank">
</head>
<body>
<!--LUA-->
-- Script not found or not loaded
-- Visit https://zurai02.is-a.dev to create scripts
--LUA-->
<script>
(function(){
    try {
        var stored = localStorage.getItem('zp_scripts');
        var params = new URLSearchParams(window.location.search);
        var scriptId = params.get('script');
        if (stored && scriptId) {
            var scripts = JSON.parse(stored);
            var script = scripts.find(function(s){ return s.id === scriptId; });
            if (script && script.code) {
                document.body.innerHTML = '<!--LUA-->\n' + script.code + '\n<!--/LUA-->';
            }
        }
    } catch (e) {
        document.body.innerHTML = '<!--LUA-->\n-- Error loading script\n--LUA-->';
    }
})();
</script>
</body>
</html>
