<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZP Raw</title>
<base target="_blank">
</head>
<body>
<!--LUA-->
-- Script not found
-- Visit https://zurai02-productions.vercel.app/ to create scripts
--LUA-->
<script>
(function() {
    try {
        var stored = localStorage.getItem('zp_scripts_v3');
        var id = new URLSearchParams(location.search).get('script');
        if (!stored || !id) return;
        var scripts = JSON.parse(stored);
        var s = scripts.find(function(x) { return x.id === id; });
        if (s && s.code) {
            document.body.innerHTML = '<!--LUA-->\n' + s.code + '\n<!--/LUA-->';
        }
    } catch (e) {
        document.body.innerHTML = '<!--LUA-->\n-- Error loading script\n--LUA-->';
    }
})();
</script>
</body>
</html>
