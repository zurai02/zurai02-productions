<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=protection.html">
<title>Raw Script</title>
<script>
(function(){
    var e = ['syn','krnl','fluxus','getexecutorname','getgc','getconnections','getloadedmodules','hookfunction'];
    var isBrowser = !e.some(function(x){ return typeof window[x] !== 'undefined'; });
    var params = new URLSearchParams(window.location.search);
    var scriptId = params.get('script');
    if (isBrowser) {
        window.location.replace('protection.html' + (scriptId ? '?script=' + scriptId : ''));
        return;
    }
    // Executor context - output Lua code
    var stored = localStorage.getItem('zp_scripts');
    if (stored) {
        var scripts = JSON.parse(stored);
        var s = scripts.find(function(x){ return x.id === scriptId; });
        if (s) {
            document.write(s.code);
        } else {
            document.write('-- Script not found');
        }
    } else {
        document.write('-- No scripts stored');
    }
})();
</script>
<style>body{background:#0a0a14;color:#a78bfa;font-family:monospace;padding:20px;white-space:pre-wrap}</style>
<base target="_blank">
</head>
<body>-- Loading...</body>
</html>
